name: pie-train
channels:
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python + basic system deps via conda
  - python=3.11
  - pip
  - sentencepiece>=0.1.99
  - protobuf>=3.20.0
  - pillow>=9.0.0
  - tqdm>=4.65.0
  - safetensors>=0.3.0

  # Everything ML goes through pip for consistent version resolution
  - pip:
      # ── PyTorch (cu126 wheels for CUDA 12.6+ driver compat) ──
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.6.0
      - torchvision==0.21.0

      # ── Unsloth + its tight dependencies ──
      - unsloth==2026.3.18
      - unsloth-zoo==2026.3.7
      - torchao==0.13.0
      - xformers==0.0.29.post3

      # ── Hugging Face stack (versions verified against unsloth constraints) ──
      - transformers==4.56.2
      - trl==0.23.0
      - peft==0.18.1
      - accelerate==1.6.0
      - datasets==4.3.0
      - huggingface_hub==0.36.2
      - bitsandbytes==0.49.2

      # ── Other ──
      - triton==3.2.0
      - tyro
